<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Valerio Ciotti</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080b12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { color-scheme: dark; --bg: #080b12; --ink: #eef1f7; --ink-2: #a9b1c3; --ink-3: #6c7589; --line: rgba(255,255,255,.09); --accent: #6fe3ff;
  --display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 32px 24px; position: relative; overflow: hidden;
  background: radial-gradient(120% 80% at 70% 30%, #111a2c 0%, var(--bg) 60%), var(--bg); color: var(--ink); font: 400 18px/1.6 var(--display); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
main { position: relative; z-index: 1; display: grid; gap: 18px; justify-items: center; }
.kicker { margin: 0; font: 400 13px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.title { margin: 0; font: 500 clamp(96px, 22vw, 260px)/.9 var(--display); letter-spacing: -.05em; }
.title em { font-style: normal; color: var(--accent); }
.lede { margin: 0; font-size: clamp(18px, 1.6vw, 22px); color: var(--ink-2); max-width: 30em; }
.links { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.links a { text-decoration: none; color: var(--ink-2); padding: 11px 20px; border-radius: 999px; border: 1px solid var(--line); background: rgba(14,19,29,.62); backdrop-filter: blur(12px); transition: color .2s, border-color .2s, transform .2s; }
.links a:hover, .links a:focus-visible { color: var(--ink); border-color: var(--accent); transform: translateY(-2px); }
.links a.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.links a.primary:hover, .links a.primary:focus-visible { border-color: var(--accent); background: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .links a { transition: none; } .links a:hover, .links a:focus-visible { transform: none; } }
</style>
</head>
<body>
<canvas id="net" aria-hidden="true"></canvas>
<main>
  <p class="kicker">Valerio Ciotti</p>
  <h1 class="title">4<em>0</em>4</h1>
  <p class="lede">This page drifted out of orbit.</p>
  <nav class="links" aria-label="Where to go"><a class="primary" href="/">Home</a><a href="/projects/">All work</a><a href="/writing/">Writing</a></nav>
</main>
<script>
/* a small slowly turning sphere of dots and links, behind the text */
(() => {
  const cv = document.getElementById("net"), ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const N = 120, pts = [], edges = [];
  for (let i = 0; i < N; i++) {   // Fibonacci sphere
    const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), th = i * Math.PI * (3 - Math.sqrt(5));
    pts.push([Math.cos(th) * r, y, Math.sin(th) * r]);
  }
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
    const d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1], pts[i][2] - pts[j][2]);
    if (d < .34) edges.push([i, j]);
  }
  let W, H, a = 0.6;
  const size = () => { const dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  const draw = () => {
    ctx.clearRect(0, 0, W, H);
    const R = Math.min(W, H) * .46, cx = W / 2, cy = H / 2, ca = Math.cos(a), sa = Math.sin(a), tilt = .35, ct = Math.cos(tilt), st = Math.sin(tilt);
    const P = pts.map(p => { const x = p[0] * ca + p[2] * sa, z = -p[0] * sa + p[2] * ca, y = p[1] * ct - z * st, z2 = p[1] * st + z * ct; return [cx + x * R, cy + y * R, z2]; });
    ctx.strokeStyle = "#6fe3ff"; ctx.lineWidth = 1;
    for (const [i, j] of edges) { ctx.globalAlpha = .05 + .17 * ((P[i][2] + P[j][2]) / 2 + 1) / 2; ctx.beginPath(); ctx.moveTo(P[i][0], P[i][1]); ctx.lineTo(P[j][0], P[j][1]); ctx.stroke(); }
    ctx.fillStyle = "#eef1f7";
    for (const p of P) { ctx.globalAlpha = .12 + .5 * (p[2] + 1) / 2; ctx.beginPath(); ctx.arc(p[0], p[1], 1.2 + 1.6 * (p[2] + 1) / 2, 0, 7); ctx.fill(); }
  };
  const loop = () => { a += .0022; draw(); requestAnimationFrame(loop); };
  size(); addEventListener("resize", () => { size(); draw(); });
  still ? draw() : loop();
})();
</script>
</body>
</html>
