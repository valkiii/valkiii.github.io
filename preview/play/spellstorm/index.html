<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Spellstorm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Chewy&family=Fondamento&family=Pirata+One&family=Uncial+Antiqua&display=swap">
<style>
/* Layout: the live game world fills the screen; menus float over it as a spellbook column on a scrim.
   Each world (theme) rewrites these tokens at runtime, so the whole interface changes with it. */
:root {
  --bg: #15122c; --panel: #201b40; --panel2: #2c2556; --ink: #efe8ff; --muted: #a99fd2;
  --accent: #f2c14e; --accent2: #7ee0ff; --danger: #ff6b7a; --line: rgba(239,232,255,.14); --on: #241a00;
  --display: "Uncial Antiqua", "Palatino Linotype", Georgia, serif;
  --body: "Alegreya Sans", "Trebuchet MS", sans-serif;
  --r: 12px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
#cv { position: fixed; inset: 0; display: block; touch-action: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent2); outline-offset: 2px; }
kbd { display: inline-block; min-width: 1.5em; padding: 1px 6px; margin: 0 2px 2px 0; border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 6px; background: var(--panel2); font: 700 .78em/1.4 var(--body); text-align: center; }

/* ---------- overlay root ---------- */
#ui { position: fixed; inset: 0; z-index: 10; overflow-y: auto; overflow-x: hidden; display: flex; justify-content: center; align-items: flex-start;
  padding: 24px 16px; box-sizing: border-box; background: color-mix(in srgb, var(--bg) 70%, transparent); }
#ui.menu-mode { background: linear-gradient(100deg, color-mix(in srgb, var(--bg) 95%, transparent) 0%, color-mix(in srgb, var(--bg) 84%, transparent) 48%, color-mix(in srgb, var(--bg) 40%, transparent) 100%); }
#ui.scr-levelup { background: color-mix(in srgb, var(--bg) 55%, transparent); }
.screen { width: min(1080px, 100%); margin-block: auto; display: grid; gap: 16px; min-width: 0; }
.scr-pause .screen, .scr-clear .screen, .scr-over .screen, .scr-results .screen, .scr-gwait .screen { width: min(560px, 100%); }
.scr-setup .screen, .scr-saves .screen, .scr-settings .screen, .scr-online .screen, .scr-lobby .screen { width: min(820px, 100%); }

h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 400; }
h2 { font-family: var(--display); font-size: clamp(26px, 4vw, 34px); line-height: 1.1; }
h3 { font-family: var(--display); font-size: 21px; line-height: 1.2; }
p { margin: 0; }
.eyebrow { font: 800 13px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--accent2); margin-bottom: 8px; }
.hint { color: var(--muted); font-size: 15px; }
.muted { color: var(--muted); }
.err { color: var(--danger); font-weight: 700; min-height: 1em; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.card h2 { font-size: 22px; }

/* ---------- buttons ---------- */
.btn { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; text-align: left; padding: 12px 16px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel2); font-weight: 700; font-size: 17px; transition: transform .12s, background .12s, border-color .12s; }
.btn small { font-weight: 500; font-size: 14px; color: var(--muted); }
.btn:hover:not([disabled]) { border-color: var(--accent); transform: translateX(3px); }
.btn.primary { background: var(--accent); color: var(--on); border-color: transparent; }
.btn.primary small { color: color-mix(in srgb, var(--on) 72%, transparent); }
.btn.danger { color: var(--danger); }
.btn.ghost { background: transparent; }
.btn.small { padding: 7px 12px; font-size: 14px; }
.btn.big { padding: 16px 20px; font-size: 20px; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.back { background: none; border: 0; color: var(--muted); font-weight: 700; padding: 6px 0; justify-self: start; }
.back:hover { color: var(--ink); }
.panel-head { display: grid; gap: 4px; }
.stack { display: grid; gap: 8px; }

/* ---------- main menu ---------- */
.menu-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 32px; align-items: start; }
.brand-col { display: grid; gap: 14px; align-content: start; padding-top: 4vh; }
.logo { font-family: var(--display); font-size: clamp(46px, 6.2vw, 86px); line-height: .95; color: var(--accent); letter-spacing: -.01em;
  text-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 40%, #000), 0 0 40px color-mix(in srgb, var(--accent) 35%, transparent); }
.blurb { font-size: 19px; max-width: 30ch; }
.menu-nav { display: grid; gap: 8px; max-width: 440px; margin-top: 8px; }
.side-col { display: grid; gap: 14px; }
.themes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.theme { display: grid; gap: 4px; text-align: left; padding: 8px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel2); }
.theme img { width: 100%; aspect-ratio: 2 / 1; border-radius: 6px; display: block; image-rendering: auto; }
.theme b { font-size: 18px; font-weight: 400; line-height: 1.15; }
.theme small { color: var(--muted); font-size: 13px; line-height: 1.3; }
.theme.on { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.ages { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.chip { display: grid; gap: 2px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel2); }
.chip b { font-size: 16px; }
.chip span { font-size: 13px; color: var(--muted); line-height: 1.3; }
.chip.on { border-color: var(--accent2); background: color-mix(in srgb, var(--accent2) 14%, var(--panel2)); }
.controls dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; align-items: baseline; font-size: 15px; }
.controls dt { font-weight: 700; }
.controls dd { margin: 0; color: var(--muted); }

/* ---------- setup ---------- */
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); justify-self: start; }
.seg button { border: 0; background: transparent; padding: 9px 18px; border-radius: 9px; font-weight: 800; }
.seg button.on { background: var(--accent); color: var(--on); }
.pgrid { display: grid; gap: 14px; }
.pgrid.two { grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); }
.pcard { border-top: 4px solid var(--pc); }
.pcard-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.kbdhint { font-size: 13px; color: var(--muted); font-weight: 700; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font: 800 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.field.inline { display: flex; align-items: center; gap: 10px; }
.field input, .field select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; min-width: 0; }
.field input[type=number] { width: 5.5em; }
textarea { width: 100%; box-sizing: border-box; font-size: 13px; resize: vertical; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 38px; height: 38px; border-radius: 50%; border: 3px solid transparent; background: radial-gradient(circle at 50% 70%, var(--tr) 0 22%, var(--sw) 24%); box-shadow: 0 0 0 1px var(--line); }
.sw.on { border-color: var(--ink); }
.spells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.spell { display: grid; justify-items: center; gap: 2px; padding: 10px 6px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel2); text-align: center; }
.spell img { width: 40px; height: 40px; }
.spell b { font-size: 14px; line-height: 1.2; }
.spell small { font-size: 12px; color: var(--muted); }
.spell.on { border-color: var(--accent); }
.start-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.check { display: flex; gap: 10px; align-items: center; font-weight: 600; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

/* ---------- levels ---------- */
.level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.lvl { display: grid; gap: 2px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); min-height: 92px; align-content: start; }
.lvl .num { font-family: var(--display); font-size: 30px; line-height: 1; color: var(--muted); font-variant-numeric: tabular-nums; }
.lvl .boss { font-size: 13px; font-weight: 700; line-height: 1.25; }
.lvl .tag { font-size: 12px; color: var(--accent2); line-height: 1.25; }
.lvl.reached { background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
.lvl.reached .num { color: var(--accent); }
.lvl.on, .lvl:hover { border-color: var(--accent); }
.row-card { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* ---------- saves ---------- */
.slots { display: grid; gap: 10px; }
.slot { grid-template-columns: 110px minmax(0, 1fr) auto; align-items: center; }
.slot-name { font-family: var(--display); font-size: 20px; }
.slot-sum { font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.slot-acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.slot .code-out { grid-column: 1 / -1; }
.import summary { cursor: pointer; font-weight: 800; }

/* ---------- settings ---------- */
.sliders { display: grid; gap: 10px; }
.slider { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr) 56px; gap: 12px; align-items: center; font-weight: 600; }
.slider input { accent-color: var(--accent); width: 100%; }
.slider output { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 800; }

/* ---------- lobby ---------- */
.code-card { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.code-card span { font: 800 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.code-card strong { font-family: var(--display); font-size: 46px; letter-spacing: .2em; color: var(--accent); line-height: 1; }
.roster { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.roster li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.roster .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--sw); }
.roster em { font-style: normal; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--panel2); color: var(--accent2); }
.roster small { color: var(--muted); }

/* ---------- in-game overlays ---------- */
.overlay-card { gap: 14px; }
.narrow { width: 100%; box-sizing: border-box; }
.bhead { font-family: var(--body); font-weight: 800; font-size: 15px; margin-top: 4px; }
.build { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.build li { display: flex; gap: 8px; align-items: center; font-size: 14px; min-width: 0; }
.build img { width: 26px; height: 26px; flex: none; }
.build span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.build b { font-size: 12px; color: var(--muted); }
.standings { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.standings th, .standings td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.standings th { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.lvlup { display: grid; gap: 14px; justify-items: center; text-align: center; padding-top: 6vh; }
.lvlup h2 { font-size: clamp(32px, 5vw, 48px); color: var(--accent); text-shadow: 0 3px 18px rgba(0,0,0,.4); }
.offers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: 100%; }
.offer { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; padding: 16px; border-radius: 14px;
  border: 2px solid var(--line); background: var(--panel); box-shadow: 0 12px 30px rgba(0,0,0,.3); transition: transform .12s, border-color .12s; }
.offer:hover, .offer:focus-visible { transform: translateY(-4px); border-color: var(--accent); }
.offer img { width: 56px; height: 56px; }
.offer .otext { display: grid; gap: 3px; min-width: 0; }
.offer .otag { font: 800 12px/1.2 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent2); }
.offer b { font-family: var(--display); font-weight: 400; font-size: 20px; line-height: 1.15; }
.offer small { color: var(--muted); font-size: 14px; line-height: 1.35; }
.offer .el { justify-self: start; margin-top: 4px; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--ec); color: var(--ec); }
.offer .key { position: absolute; top: -10px; left: -10px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: var(--on); font-weight: 800; font-size: 15px; }

/* ---------- multiplayer pick panels ---------- */
#picks { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.pickpanel { pointer-events: auto; width: min(420px, 48vw); background: color-mix(in srgb, var(--bg) 88%, transparent); border: 2px solid var(--pc); border-radius: 14px; padding: 10px; display: grid; gap: 8px; }
.pickpanel.right { margin-left: auto; }
.pickpanel.center { margin: 0 auto; width: min(640px, 100%); }
.pp-head { font-weight: 700; font-size: 14px; }
.pp-head b { color: var(--pc); }
.pp-offers { display: grid; gap: 6px; }
.pickpanel .offer { grid-template-columns: 36px minmax(0, 1fr); padding: 8px 10px 8px 14px; gap: 10px; box-shadow: none; border-width: 1px; }
.pickpanel .offer img { width: 36px; height: 36px; }
.pickpanel .offer b { font-size: 16px; }
.pickpanel .offer small { font-size: 12px; }
.pickpanel .offer .el { display: none; }
.pickpanel .offer .key { top: 50%; left: -10px; transform: translateY(-50%); width: 22px; height: 22px; font-size: 12px; }
.pickpanel .offer:hover { transform: none; }

#pausebtn { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(150px); z-index: 9; width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 70%, transparent); font-weight: 800; letter-spacing: -1px; }
#toast { position: fixed; top: calc(70px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--bg);
  padding: 8px 16px; border-radius: 99px; font-weight: 800; box-shadow: 0 6px 20px rgba(0,0,0,.3); max-width: calc(100vw - 32px); text-align: center; }

@media (max-width: 860px) {
  .menu-grid { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .brand-col { padding-top: 0; }
  .offers { grid-template-columns: minmax(0, 1fr); }
  .slot { grid-template-columns: minmax(0, 1fr); }
  .slot-acts { justify-content: flex-start; }
  .slider { grid-template-columns: minmax(0, 1fr) 56px; }
  .slider span { grid-column: 1 / -1; }
  #picks { flex-direction: column; align-items: stretch; }
  .pickpanel { width: auto; }
  #pausebtn { transform: none; left: auto; right: 14px; top: calc(110px + env(safe-area-inset-top, 0px)); }
}
@media (max-width: 480px) {
  .themes, .ages { grid-template-columns: minmax(0, 1fr); }
  .controls dl { grid-template-columns: minmax(0, 1fr); }
  .spells { grid-template-columns: minmax(0, 1fr); }
  .spell { grid-template-columns: 40px 1fr; justify-items: start; text-align: left; }
  .spell small { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) { .btn, .offer { transition: none; } .btn:hover:not([disabled]), .offer:hover { transform: none; } }
</style>
<canvas id="cv" aria-label="Spellstorm game world"></canvas>
<div id="picks" aria-live="polite"></div>
<button id="pausebtn" aria-label="Pause" hidden>II</button>
<div id="ui" hidden></div>
<div id="toast" role="status" hidden></div>
<script>
'use strict';
/* ============================================================
   DATA — themes, spells, enemy forms, age presets
   ============================================================ */
const ELS = ['arcane', 'fire', 'frost', 'storm'];
const PCOL = ['#ffd25a', '#5ad1ff', '#ff7ab6', '#8dff7a'];   // player ring colours
const START_SPELLS = ['bolt', 'fireball', 'chain'];

const WEAPON_META = {
  bolt:     { el: 'arcane', ch: 'b', desc: 'Homing missiles seek the nearest enemy.' },
  fireball: { el: 'fire',   ch: 'f', desc: 'A slow orb that bursts on impact.' },
  orbit:    { el: 'arcane', ch: 'o', desc: 'Orbs circle you and strike whatever they touch.' },
  chain:    { el: 'storm',  ch: 'c', desc: 'Lightning leaps from foe to foe.' },
  nova:     { el: 'frost',  ch: 'n', desc: 'A freezing pulse that hurts and slows everything near you.' },
  meteor:   { el: 'fire',   ch: 'm', desc: 'Burning strikes fall onto the crowd.' },
  gale:     { el: 'storm',  ch: 'g', desc: 'Spinning blades fly out, cut through everything and come back.' },
};
const WEAPON_IDS = Object.keys(WEAPON_META);
const WEAPON_BY_CH = Object.fromEntries(WEAPON_IDS.map(id => [WEAPON_META[id].ch, id]));

const PASSIVE_META = {
  might:    { ch: 'M', desc: '+12% spell damage' },
  haste:    { ch: 'H', desc: 'Spells recharge 8% faster' },
  swift:    { ch: 'S', desc: '+9% move speed' },
  vitality: { ch: 'V', desc: '+25 max health' },
  magnet:   { ch: 'G', desc: '+35% pickup range' },
  regen:    { ch: 'R', desc: 'Recover 0.5 health per second' },
};
const PASSIVE_IDS = Object.keys(PASSIVE_META);
const PASSIVE_BY_CH = Object.fromEntries(PASSIVE_IDS.map(id => [PASSIVE_META[id].ch, id]));
const MAX_WLV = 8, MAX_PLV = 5, MAX_WEAPONS = 5;

/* Enemy forms. `from` = first level the form appears on. */
const FORMS = {
  grunt:    { hp: 22,  spd: 62,  dmg: 8,  r: 13, xp: 1, from: 1, w: 4 },
  swarm:    { hp: 9,   spd: 108, dmg: 5,  r: 9,  xp: 1, from: 1, w: 3 },
  brute:    { hp: 115, spd: 42,  dmg: 16, r: 24, xp: 5, from: 2, w: 1 },
  caster:   { hp: 30,  spd: 56,  dmg: 7,  r: 14, xp: 3, from: 3, w: 1.2 },
  splitter: { hp: 46,  spd: 52,  dmg: 9,  r: 16, xp: 2, from: 4, w: 1.3 },
  phantom:  { hp: 34,  spd: 58,  dmg: 9,  r: 14, xp: 3, from: 5, w: 1 },
  charger:  { hp: 58,  spd: 60,  dmg: 14, r: 17, xp: 4, from: 6, w: 1 },
  boss:     { hp: 1400, spd: 50, dmg: 22, r: 46, xp: 60, from: 1, w: 0 },
};
const FORM_IDS = ['grunt', 'swarm', 'brute', 'caster', 'splitter', 'phantom', 'charger'];
const FORM_CH = { grunt: 'g', swarm: 's', brute: 'b', caster: 'c', splitter: 'p', phantom: 'h', charger: 'x', boss: 'B' };
const FORM_BY_CH = Object.fromEntries(Object.entries(FORM_CH).map(([k, v]) => [v, k]));

const AGES = {
  little: { label: 'Little ones', sub: 'Ages 4–7. Slow, gentle, heroes get back up.',
            enemySpeed: 0.65, enemyDamage: 0.35, enemyHealth: 0.7, density: 0.6, stageLength: 60, autoRevive: true },
  kids:   { label: 'Young heroes', sub: 'Ages 8–12. A relaxed adventure.',
            enemySpeed: 0.85, enemyDamage: 0.65, enemyHealth: 0.85, density: 0.8, stageLength: 90, autoRevive: false },
  teens:  { label: 'Teens & adults', sub: 'The standard challenge.',
            enemySpeed: 1, enemyDamage: 1, enemyHealth: 1, density: 1, stageLength: 90, autoRevive: false },
  legend: { label: 'Legend', sub: 'Faster, tougher, more of them.',
            enemySpeed: 1.15, enemyDamage: 1.5, enemyHealth: 1.35, density: 1.3, stageLength: 120, autoRevive: false },
};

const THEMES = {
  wizards: {
    name: 'Wizard Academy', blurb: 'Robes, runes and a forest full of rogue spells.',
    font: '"Uncial Antiqua", "Palatino Linotype", Georgia, serif',
    css: { bg: '#15122c', panel: '#201b40', panel2: '#2c2556', ink: '#efe8ff', muted: '#a99fd2', accent: '#f2c14e', accent2: '#7ee0ff', danger: '#ff6b7a', line: 'rgba(239,232,255,.14)', scheme: 'dark' },
    ground: { base: '#1e2b2a', alt: ['#223231', '#1a2625', '#24302b'], speck: '#2e403a', style: 'grass' },
    edge: '#0d1313',
    decor: [{ k: 'rock', c: '#3b4846', w: 3 }, { k: 'mushroom', c: '#b25bd1', w: 2 }, { k: 'rune', c: '#5fd3ff', w: 1 }, { k: 'tuft', c: '#30503f', w: 5 }],
    hero: { label: 'Wizard', hat: 'wizard', beard: true, wings: false, tip: 'orb', staff: '#7a4f2a', skin: '#f0cfb2',

/* ---------- UI controller ---------- */
const UI = {
  root: document.getElementById('ui'), layer: document.getElementById('picks'), screen: null, params: {}, stack: [], sig: '', toastT: 0,
  show(name, params = {}) { this.screen = name; this.params = params; this.render(); },
  go(name, params = {}) { if (this.screen) this.stack.push([this.screen, this.params]); this.show(name, params); },
  back() {
    const prev = this.stack.pop();
    if (prev) { this.show(prev[0], prev[1]); return; }
    if (G && !G.demo && G.state === 'paused') { G.state = 'play'; this.hide(); return; }
    if (G && G.demo) this.show('menu'); else this.hide();
  },
  hide() { this.screen = null; this.root.hidden = true; this.root.innerHTML = ''; },
  render() {
    const fn = SCREENS[this.screen]; if (!fn) return this.hide();
    const ae = document.activeElement, keepId = ae && ae.id && this.root.contains(ae) ? ae.id : null, sel = keepId && ae.selectionStart;
    this.root.hidden = false; this.root.className = 'scr-' + this.screen + (G && G.demo ? ' menu-mode' : '');
    this.root.innerHTML = `<div class="screen">${fn(this.params)}</div>`;
    if (keepId) { const el = document.getElementById(keepId); if (el) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch { } } }
    else if (!['menu'].includes(this.screen)) { const f = this.root.querySelector('.btn.primary:not([disabled]), .offer'); if (f && !('ontouchstart' in window)) f.focus({ preventScroll: true }); }
  },
  refresh() { if (this.screen && this.screen !== 'levelup') this.render(); },
  refreshSoon() { clearTimeout(this._rs); this._rs = setTimeout(() => this.refresh(), 120); },
  toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; this.toastT = 2.6; },
  onStageEnd(kind) { this.stack = []; this.show(kind); },
  onGuestPhase(ph) {
    if (ph === 'play') { if (['gwait', 'clear', 'over', 'results'].includes(this.screen)) this.hide(); }
    else if (ph === 'paused') this.show('gwait', { text: 'The host paused the game.' });
    else if (ph === 'clear' || ph === 'over' || ph === 'results') { this.stack = []; this.show(ph); }
  },
  tick(dt) {
    if (this.toastT > 0) { this.toastT -= dt; if (this.toastT <= 0) document.getElementById('toast').hidden = true; }
    const g = G; if (!g || g.demo) { this.drawPicks(''); return; }
    if (g.net === 'local' && g.mode === 'solo' && g.state === 'play' && g.introT < 1.2) {
      const p = g.players[0]; if (p.pending > 0) { ensureOffers(p); g.state = 'levelup'; sfx('level', 0.2); this.show('levelup'); }
    }
    document.getElementById('pausebtn').hidden = !!this.screen;
    this._pt = (this._pt || 0) + dt; if (this._pt < 0.15) return; this._pt = 0;
    let html = '';
    if (g.net === 'guest') {
      const me = g.players[g.me];
      if (me && me.offers && me.pickSeq >= (Net.sentPick || 0) && Net.phase === 'play') html = this.pickPanel(me, 'gpick', ['1', '2', '3'], 'center');
    } else if (g.mode !== 'solo' && g.state === 'play') {
      g.players.forEach((p, i) => { if (p.input !== 'remote' && p.offers && p.alive) html += this.pickPanel(p, 'mpick' + i, i === 0 ? ['1', '2', '3'] : ['8', '9', '0'], i === 0 ? 'left' : 'right'); });
    }
    this.drawPicks(html);
  },
  pickPanel(p, act, keys, side) {
    const multi = G.players.length > 1;
    return `<div class="pickpanel ${side}" style="--pc:${PCOL[p.idx]}"><div class="pp-head">${multi ? `<b>${esc(p.name)}</b> ` : ''}Level up! Choose a power${p.pending > 1 ? ` (${p.pending})` : ''}</div>
      <div class="pp-offers">${p.offers.map((o, i) => offerCard(p, o, i, act, keys[i])).join('')}</div></div>`;
  },
  drawPicks(html) { if (html === this.sig) return; this.sig = html; this.layer.innerHTML = html; },
};

/* ---------- actions ---------- */
function resumeGame() { if (G && G.state === 'paused') G.state = 'play'; UI.stack = []; UI.hide(); }
const ACT = {
  go(a, b) { const prm = b.dataset.param ? { mode: b.dataset.param } : {}; UI.go(a, prm); },
  back() { UI.back(); },
  theme(k) { if (!THEMES[k]) return; S.theme = k; saveSettings(); startDemo(); applyTheme(); UI.refresh(); },
  age(k) { applyAge(k); saveSettings(); setVolumes(); UI.refresh(); },
  mode(m) { SETUP.mode = m; saveSetup(); UI.refresh(); },
  pal(a) { const [i, j] = a.split(':').map(Number); SETUP.players[i].pal = j; saveSetup(); UI.refresh(); if (Net.role === 'guest') Net.set({ pal: j }); },
  spell(a) { const [i, id] = a.split(':'); SETUP.players[+i].start = id; saveSetup(); UI.refresh(); if (Net.role === 'guest') Net.set({ sw: id }); },
  start() { startLocal(); },
  pickLevel(n) { SETUP.stage = clamp(+n, 1, 99); saveSetup(); if (UI.stack.length && UI.stack[UI.stack.length - 1][0] === 'setup') UI.back(); else { UI.stack.push(['menu', {}]); UI.show('setup'); } },
  pickLevelAny() { ACT.pickLevel(document.getElementById('lvl-any').value | 0 || 1); },
  continue() { const s = newestSave(); if (s) loadSave(s); },
  loadSlot(s) { const o = allSaves()[s]; if (o) loadSave(o); },
  saveTo(s) { if (!G || G.demo) return; writeSave(s, saveObject(G.state === 'clear' ? G.stage + 1 : G.stage)).then(() => UI.refresh()); UI.toast('Saved to ' + SLOT_NAMES[s]); UI.refresh(); },
  delSlot(s) { writeSave(s, null).then(() => UI.refresh()); UI.refresh(); UI.toast(SLOT_NAMES[s] + ' deleted'); },
  copyCode(s, b) {
    const o = allSaves()[s]; if (!o) return; const code = exportCode(o), ta = document.getElementById('code-' + s);
    ta.value = code; ta.hidden = false; ta.select();
    try { navigator.clipboard.writeText(code).then(() => UI.toast('Save code copied'), () => UI.toast('Select the code and copy it')); } catch { UI.toast('Select the code and copy it'); }
  },
  importCode() {
    const o = importCode(document.getElementById('imp-code').value), slot = document.getElementById('imp-slot').value;
    if (!o) { document.getElementById('imp-err').textContent = 'That code is not a Spellstorm save. Check that you copied all of it.'; return; }
    writeSave(slot, o).then(() => UI.refresh()); UI.toast('Imported into ' + SLOT_NAMES[slot]); UI.refresh();
  },
  host() { audioInit(); Net.host(null); },
  join() { audioInit(); Net.joinGame(document.getElementById('join-code').value); },
  lobbyMode(m) { Net.lobbyCfg.mode = m; Net.pushLobby(); UI.refresh(); },
  lobbyStart() { Net.startHosted(); },
  copyRoom() { try { navigator.clipboard.writeText(Net.code).then(() => UI.toast('Code copied'), () => UI.toast('Code: ' + Net.code)); } catch { UI.toast('Code: ' + Net.code); } },
  leaveOnline() { if (Net.role === 'host' && Net.room) Net.set({ ph: 'ended', s: null }); setTimeout(() => toMenu(), Net.role === 'host' ? 300 : 0); },
  resume() { resumeGame(); },
  quit() { if (G && G.net === 'host') ACT.leaveOnline(); else toMenu(); },
  offer(i) { const p = G.players[0]; if (!p.offers) return; choosePick(p, p.offers[+i]); sfx('heal'); if (p.pending > 0) UI.show('levelup'); else { G.state = 'play'; UI.hide(); } },
  gpick(i) { const me = G.players[G.me]; if (me && me.offers) { Net.sentPick = me.pickSeq + 1; Net.guestPick(me.offers[+i]); UI.sig = '!'; } },
  next() { G.stage++; G.epoch = (G.epoch || 0) + 1; startStage(); UI.stack = []; UI.hide(); },
  retry() { restoreCheckpoint(); G.epoch = (G.epoch || 0) + 1; startStage(); UI.stack = []; UI.hide(); },
};
ACT.mpick0 = i => { const p = G.players[0]; if (p.offers) { choosePick(p, p.offers[+i]); sfx('heal'); UI.sig = '!'; } };
ACT.mpick1 = i => { const p = G.players[1]; if (p && p.offers) { choosePick(p, p.offers[+i]); sfx('heal'); UI.sig = '!'; } };

function handleAct(b) {
  const act = b.dataset.act; if (!ACT[act]) return;
  if (b.dataset.confirm && !b.dataset.armed) { b.dataset.armed = '1'; const span = b.querySelector('span') || b; b._old = span.textContent; span.textContent = b.dataset.confirm; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; span.textContent = b._old; } }, 3000); return; }
  audioInit(); sfx('click'); ACT[act](b.dataset.arg, b);
}
document.getElementById('ui').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) handleAct(b); });
document.getElementById('picks').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) handleAct(b); });
document.getElementById('pausebtn').addEventListener('click', () => onGameKey({ code: 'Escape', preventDefault() { } }));
document.getElementById('ui').addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.field === 'name') { SETUP.players[+t.dataset.p].name = cleanName(t.value) || ''; saveSetup(); if (Net.role === 'guest' && +t.dataset.p === 0 && !S.nick) Net.set({ nick: cleanName(t.value) }); return; }
  if (t.dataset.setup === 'stage') { SETUP.stage = clamp(t.value | 0, 1, 99); saveSetup(); clearTimeout(UI._st); UI._st = setTimeout(() => UI.refresh(), 500); return; }
  if (t.dataset.lobby === 'stage') { Net.lobbyCfg.stage = clamp(t.value | 0, 1, 99); Net.pushLobby(); return; }
  const k = t.dataset.set; if (!k) return;
  if (t.type === 'range') { S[k] = +t.value; const out = t.parentElement.querySelector('output'); if (out) out.textContent = k === 'stageLength' ? t.value + ' s' : Math.round(t.value * 100) + '%'; if (k !== 'sfx' && k !== 'music') S.custom = true; setVolumes(); }
  else if (t.type === 'checkbox') { S[k] = t.checked; if (k === 'autoRevive') S.custom = true; }
  else { S[k] = cleanName(t.value); if (k === 'nick' && Net.role === 'guest') Net.set({ nick: S.nick || 'Guest' }); if (k === 'nick' && Net.role === 'host') Net.pushLobby(); }
  saveSettings();
});
document.getElementById('ui').addEventListener('change', e => { const t = e.target; if (t.dataset.setup === 'fresh') { SETUP.fresh = t.checked; saveSetup(); UI.refresh(); } if (t.dataset.set && t.type === 'checkbox') UI.refreshSoon(); });

function onGameKey(e) {
  audioInit();
  const c = e.code, scr = UI.screen;
  if (scr === 'levelup') { const i = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[c]; if (i !== undefined) ACT.offer(i); return; }
  if (!G || G.demo) { if (c === 'Escape' && scr && scr !== 'menu' && scr !== 'lobby') UI.back(); return; }
  if (c === 'Escape' || c === 'KeyP') {
    if (G.net === 'guest') { if (!scr) UI.show('gwait', { text: 'Online game', menu: true }); else if (scr === 'gwait' && UI.params.menu) UI.hide(); return; }
    if (!scr && G.state === 'play') { G.state = 'paused'; UI.stack = []; UI.show('pause'); }
    else if (scr === 'pause') resumeGame();
    else if (scr && G.state === 'paused') UI.back();
    return;
  }
  if (scr) return;
  if (G.net === 'guest') { const i = { Digit1: 0, Digit2: 1, Digit3: 2 }[c]; if (i !== undefined) ACT.gpick(i); return; }
  if (G.mode !== 'solo') {
    const a = { Digit1: 0, Digit2: 1, Digit3: 2 }[c], b = { Digit8: 0, Digit9: 1, Digit0: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[c];
    if (a !== undefined && G.players[0].input !== 'remote') ACT.mpick0(a);
    if (b !== undefined && G.players[1] && G.players[1].input === 'kb2') ACT.mpick1(b);
  }
}

/* ---------- touch ---------- */
cv.addEventListener('touchstart', e => {
  if (!G || G.demo) return; e.preventDefault(); touch.on = true;
  for (const t of e.changedTouches) {
    if (touch.id === null && t.clientX < W * 0.6) { touch.id = t.identifier; touch.ox = t.clientX; touch.oy = t.clientY; touch.x = touch.y = 0; }
    else { touch.dash = true; setTimeout(() => { touch.dash = false; }, 150); }
  }
}, { passive: false });
cv.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) if (t.identifier === touch.id) { let dx = (t.clientX - touch.ox) / 45, dy = (t.clientY - touch.oy) / 45; const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; } touch.x = dx; touch.y = dy; }
  e.preventDefault();
}, { passive: false });
const endTouch = e => { for (const t of e.changedTouches) if (t.identifier === touch.id) { touch.id = null; touch.x = touch.y = 0; } };
cv.addEventListener('touchend', endTouch); cv.addEventListener('touchcancel', endTouch);
addEventListener('pointerdown', audioInit);

/* ---------- loop & boot ---------- */
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  try {
    if (G) {
      if (G.net === 'guest') Net.guestFrame(dt);
      else { simulate(dt); if (G.net === 'host') Net.hostFrame(dt); }
      if (G) updateCamera(dt);
      UI.tick(dt);
    } else if (Net.role === 'guest' && UI.screen === 'lobby') Net.guestLobbyTick();
    if (Net.role === 'guest' && G && G.demo && UI.screen === 'lobby') Net.guestLobbyTick();
    render(now); musicTick();
  } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}
(function boot() {
  const hot = window.claude && window.claude.hot;
  let resumed = false;
  const start = data => {
    if (data && data.save && validSave(data.save)) { startDemo(); loadSave(data.save); resumed = true; }
    if (!resumed) toMenu();
    requestAnimationFrame(loop);
  };
  try { if (hot && hot.snapshot) hot.snapshot(() => (G && !G.demo && G.net === 'local') ? { save: saveObject(G.stage) } : {}); } catch { }
  try { if (hot && hot.ready) hot.ready(start); else start(hot && hot.data || {}); } catch { start({}); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { sprCache.clear(); UI.refresh(); });
  Net.init(); cloudInit();
})();
</script>
